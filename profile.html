<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Precision Hardware</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
    <style>
        :root { --onyx: #111111; --gold: #D4AF37; --white: #ffffff; --navy: #001f3f; --orange: #ffa500; }
        body { font-family: 'Segoe UI', sans-serif; background: #0a0909; color: #333; margin: 0; }
        
        /* Profile Layout */
        .profile-container { max-width: 900px; margin: 20px auto; padding: 10px; filter: blur(5px); pointer-events: none; }
        .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
        
        /* Floating Card Styles */
        .card-link { text-decoration: none; display: block; transition: transform 0.3s ease; }
        .card-link:hover { transform: translateY(-10px); }
        .section-card { background: var(--orange); padding: 15px; border-radius: 8px; border-left: 5px solid var(--gold); height: 160px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .section-card h2 { color: var(--navy); margin-bottom: 10px; font-size: 1.1rem; }
        .section-card ul { list-style: none; padding-left: 0; }
        
        /* Interactive List Items */
        .section-card li { color: #0a0909; margin-bottom: 5px; font-size: 0.9rem; padding: 5px; cursor: pointer; transition: 0.3s; }
        .section-card li:hover { color: var(--white); background: rgba(0,0,0,0.1); border-radius: 4px; }
        
        header { background: var(--onyx); color: var(--gold); padding: 20px; text-align: center; }

        /* Auth Modal */
        #auth-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .modal-box { background: var(--white); padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 0 20px var(--gold); max-height: 90vh; overflow-y: auto; }
        .input-group { margin-bottom: 15px; width: 100%; position: relative; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .iti { width: 100%; } 
        .btn-auth { width: 100%; padding: 12px; background: var(--navy); color: var(--gold); border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        /* Fixed Toggle Position */
        .toggle-password { cursor: pointer; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; z-index: 10; }
        
        /* Logout Button */
        #logout-btn { position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; background: var(--gold); border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* Cropper Container Style */
        .crop-container { width: 100%; max-height: 250px; margin-bottom: 10px; display: none; background: #000; }
        .crop-container img { max-width: 100%; display: block; }
        .btn-crop { background: var(--gold); color: var(--onyx); border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; width: 100%; display: none; }
    </style>
</head>
<body>

<header><h1><i class="fas fa-user-circle"></i> ACCOUNT DASHBOARD</h1></header>

<div class="profile-container" id="profile-content">
    <div class="grid-layout">
        <a href="profile-edit.html" class="card-link">
            <div class="section-card">
                <h2><i class="fas fa-user-cog"></i> My Account</h2>
                <ul>
                    <li>Profile Information</li>
                    <li>Security & Password</li>
                </ul>
            </div>
        </a>
        <a href="#" class="card-link" onclick="alert('Opening Orders...')">
            <div class="section-card">
                <h2><i class="fas fa-box-open"></i> Orders</h2>
                <ul>
                    <li onclick="event.stopPropagation(); alert('Order History')">Order History</li>
                    <li onclick="event.stopPropagation(); alert('Quick Reorder')">Quick Reorder</li>
                    <li onclick="event.stopPropagation(); alert('Track Shipments')">Track Shipments</li>
                </ul>
            </div>
        </a>
    </div>
</div>

<button id="logout-btn" onclick="logout()">Logout</button>

<div id="auth-modal">
    <div class="modal-box" id="login-box">
        <h2 id="modal-title">Sign In</h2>
        <form id="auth-form" onsubmit="return false;">
            <div class="input-group"><input type="text" id="user-field" placeholder="Email or Username" required></div>
            <div class="input-group">
                <input type="password" id="pass1" placeholder="Password" required>
                <i class="fas fa-eye toggle-password" onclick="togglePass('pass1', this)"></i>
            </div>
            <button class="btn-auth" onclick="validateAndFinish()">Finish</button>
        </form>
        <p style="text-align: center; margin-top: 10px; font-size: 0.85rem;">
            <span style="color: blue; cursor: pointer;" onclick="forgotPassword()">Forgot Password?</span>
        </p>
        <p style="text-align: center; margin-top: 10px; cursor: pointer;" onclick="switchToSignup()">Don't have an account? Sign Up</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
    const SERVER_URL = "https://site-vctv.onrender.com";
    let isSignupMode = false;
    let iti = null;
    let cropper = null;
    let croppedBlob = null;

    window.onload = function() {
        if (localStorage.getItem('isLoggedIn') === 'true' && localStorage.getItem('userId')) {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('profile-content').style.filter = 'none';
            document.getElementById('profile-content').style.pointerEvents = 'auto';
        }
    };

    function logout() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('userId');
        localStorage.removeItem('user');
        location.reload();
    }

    function togglePass(id, icon) {
        const x = document.getElementById(id);
        if (x.type === "password") {
            x.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            x.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }

    function handleImageSelect(e) {
        const files = e.target.files;
        if (files && files.length > 0) {
            const file = files[0];
            const url = URL.createObjectURL(file);
            const image = document.getElementById('crop-image');
            image.src = url;
            
            document.getElementById('crop-container').style.display = 'block';
            document.getElementById('btn-crop-action').style.display = 'block';

            if (cropper) {
                cropper.destroy();
            }

            cropper = new Cropper(image, {
                aspectRatio: 1,
                viewMode: 1,
                background: false
            });
        }
    }

    function cropImage() {
        if (cropper) {
            cropper.getCroppedCanvas({
                width: 300,
                height: 300
            }).toBlob((blob) => {
                croppedBlob = blob;
                alert("Profile image cropped successfully!");
                document.getElementById('crop-container').style.display = 'none';
                document.getElementById('btn-crop-action').style.display = 'none';
            }, 'image/jpeg');
        }
    }

    async function validateAndFinish() {
        if (isSignupMode) {
            const usernameInput = document.getElementById('user-field');
            const emailInput = document.getElementById('email-field');
            const phoneInput = document.getElementById('phone');
            const p1Input = document.getElementById('p1');
            const p2Input = document.getElementById('p2');

            const username = usernameInput ? usernameInput.value.trim() : "";
            const email = emailInput ? emailInput.value.trim() : "";
            const phone = iti ? iti.getNumber() : (phoneInput ? phoneInput.value.trim() : "");
            const p1 = p1Input ? p1Input.value : "";
            const p2 = p2Input ? p2Input.value : "";

            if (!username || !email || !phone || !p1 || !p2) {
                alert("Please fill in all sections.");
                return;
            }

            if (p1 !== p2) {
                alert("Passwords do not match!");
                return;
            }

            const formData = new FormData();
            formData.append('username', username);
            formData.append('email', email);
            formData.append('phone', phone);
            formData.append('password', p1);
            
            if (croppedBlob) {
                formData.append('profileImage', croppedBlob, 'profile.jpg');
            } else {
                const profileImageInput = document.getElementById('profile-image');
                if (profileImageInput && profileImageInput.files[0]) {
                    formData.append('profileImage', profileImageInput.files[0]);
                }
            }

            try {
                const res = await fetch(`${SERVER_URL}/api/signup`, {
                    method: 'POST',
                    body: formData
                });
                const result = await res.json();

                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userId', result.user.id);
                    localStorage.setItem('user', JSON.stringify(result.user));
                    
                    document.getElementById('auth-modal').style.display = 'none';
                    document.getElementById('profile-content').style.filter = 'none';
                    document.getElementById('profile-content').style.pointerEvents = 'auto';
                } else {
                    alert(result.message || "Signup failed!");
                }
            } catch (err) {
                console.error(err);
                alert("Server error during sign up!");
            }

        } else {
            const identifierInput = document.getElementById('user-field');
            const passInput = document.getElementById('pass1');

            const identifier = identifierInput ? identifierInput.value.trim() : "";
            const pass = passInput ? passInput.value : "";

            if (!identifier || !pass) {
                alert("Please fill in all sections.");
                return;
            }

            try {
                const res = await fetch(`${SERVER_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password: pass })
                });
                const result = await res.json();

                if (result.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userId', result.user.id);
                    localStorage.setItem('user', JSON.stringify(result.user));

                    document.getElementById('auth-modal').style.display = 'none';
                    document.getElementById('profile-content').style.filter = 'none';
                    document.getElementById('profile-content').style.pointerEvents = 'auto';
                } else {
                    alert(result.message || "Invalid credentials!");
                }
            } catch (err) {
                console.error(err);
                alert("Server error during sign in!");
            }
        }
    }

    function forgotPassword() {
        const contact = prompt("Enter your registered Email or Phone Number:");
        if (contact) alert("A reset code has been sent to " + contact);
    }

    function switchToSignup() {
        isSignupMode = true;
        document.getElementById('modal-title').innerText = "Create Account";
        document.getElementById('login-box').innerHTML = `
            <input type="text" placeholder="Username" id="user-field" style="margin-bottom:10px" required>
            <input type="email" placeholder="Email" id="email-field" style="margin-bottom:10px" required>
            <input type="tel" id="phone" style="margin-bottom:10px" required>
            <label style="font-size:0.8rem; color:#666;">Profile Photo:</label>
            <input type="file" id="profile-image" accept="image/*" style="margin-bottom:10px" onchange="handleImageSelect(event)">
            
            <div class="crop-container" id="crop-container">
                <img id="crop-image" src="" alt="Crop Preview">
            </div>
            <button type="button" id="btn-crop-action" class="btn-crop" onclick="cropImage()">Crop & Set Photo</button>

            <div class="input-group">
                <input type="password" id="p1" placeholder="Password" required>
                <i class="fas fa-eye toggle-password" onclick="togglePass('p1', this)"></i>
            </div>
            <div class="input-group">
                <input type="password" id="p2" placeholder="Confirm Password" required>
                <i class="fas fa-eye toggle-password" onclick="togglePass('p2', this)"></i>
            </div>
            <button class="btn-auth" onclick="validateAndFinish()">Finish Sign Up</button>
            <p style="text-align: center; margin-top: 10px; cursor: pointer;" onclick="location.reload()">Already have an account? Sign In</p>
        `;
        iti = intlTelInput(document.querySelector("#phone"), { initialCountry: "ug" });
    }
</script>
</body>
</html>
